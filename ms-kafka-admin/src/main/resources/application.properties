spring.application.name=ms-kafka-admin

spring.config.import=optional:file:.env[.properties]

server.port=8084

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
app.kafka.admin.timeout-ms=${KAFKA_ADMIN_TIMEOUT_MS:5000}

# JWT de Microsoft Entra ID
app.security.issuer=${JWT_ISSUER:https://login.microsoftonline.com/COMMON/v2.0}
app.security.audience=${JWT_AUDIENCE:api://placeholder}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:https://login.microsoftonline.com/COMMON/discovery/v2.0/keys}