spring.application.name=ms-notificaciones

spring.config.import=optional:file:.env[.properties]

spring.main.web-application-type=none

# Conexión a RabbitMQ
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}

# ACK manual y prefetch
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# Exchanges
app.rabbit.exchanges.events=biblioteca.events
app.rabbit.exchanges.direct=biblioteca.direct
app.rabbit.exchanges.dlx=biblioteca.dlx

# Colas principales
app.rabbit.queues.notificaciones=notificaciones.queue
app.rabbit.queues.stock=alertas.stock.queue

# Colas de mensajes fallidos
app.rabbit.queues.notificaciones-dlq=notificaciones.queue.dlq
app.rabbit.queues.stock-dlq=alertas.stock.queue.dlq

# Routing keys
app.rabbit.routes.prestamos=prestamo.*
app.rabbit.routes.stock=stock.agotado