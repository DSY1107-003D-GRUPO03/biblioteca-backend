# Kafka UI: http://localhost:8090
# Requiere que docker-compose.kafka.yml ya esté levantado (usa su red).
name: biblioteca-kafka-ui

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: biblioteca
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    networks:
      - kafka-net

networks:
  kafka-net:
    name: biblioteca-kafka-net
    external: true