spring.application.name=ms-historial
spring.config.import=optional:file:.env[.properties]
server.port=8082

# Base de datos MySQL / RDS compartida: tabla propia historial_entry
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Mensajeria RabbitMQ
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USERNAME:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# JWT de Microsoft Entra ID
app.security.issuer=${JWT_ISSUER:https://login.microsoftonline.com/COMMON/v2.0}
app.security.audience=${JWT_AUDIENCE:api://placeholder}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:https://login.microsoftonline.com/COMMON/discovery/v2.0/keys}