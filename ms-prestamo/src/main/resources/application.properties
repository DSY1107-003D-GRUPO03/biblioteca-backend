spring.application.name=ms-prestamo

spring.config.import=optional:file:.env[.properties]

server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USERNAME:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

app.security.issuer=${JWT_ISSUER:https://login.microsoftonline.com/COMMON/v2.0}
app.security.audience=${JWT_AUDIENCE:api://placeholder}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:https://login.microsoftonline.com/COMMON/discovery/v2.0/keys}

catalogo.url=${CATALOGO_URL:http://localhost:8080}



app.rabbit.exchange=biblioteca.events
app.rabbit.rk-creado=prestamo.creado
app.rabbit.rk-devuelto=prestamo.devuelto