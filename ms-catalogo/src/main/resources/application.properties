spring.config.import=optional:file:.env[.properties]

spring.application.name=biblioteca-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

app.security.issuer=${JWT_ISSUER:https://login.microsoftonline.com/COMMON/v2.0}
app.security.audience=${JWT_AUDIENCE:api://placeholder}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:https://login.microsoftonline.com/COMMON/discovery/v2.0/keys}


#RabbitMQ
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USERNAME:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

#Nombres de mensajería
app.messaging.exchange.events=biblioteca.events
app.messaging.exchange.direct=biblioteca.direct
app.messaging.exchange.dlx=biblioteca.dlx

app.messaging.queue.notificaciones=notificaciones.queue
app.messaging.queue.historial=historial.queue
app.messaging.queue.alertas-stock=alertas.stock.queue

app.messaging.rk.libro-creado=libro.creado
app.messaging.rk.libro-eliminado=libro.eliminado
app.messaging.rk.stock-agotado=stock.agotado
