spring.application.name=ms-analitica
spring.config.import=optional:file:.env[.properties]
server.port=8085

# Base de datos compartida: tablas propias del servicio
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
app.kafka.topic-prestamos=prestamos.eventos
app.kafka.topic-catalogo=catalogo.eventos
app.kafka.group-prestamos=analitica-prestamos
app.kafka.group-catalogo=analitica-catalogo
app.kafka.reintentos=3
app.kafka.espera-ms=1000

# JWT de Microsoft Entra ID
app.security.issuer=${JWT_ISSUER:https://login.microsoftonline.com/COMMON/v2.0}
app.security.audience=${JWT_AUDIENCE:api://placeholder}
app.security.jwk-set-uri=${JWT_JWK_SET_URI:https://login.microsoftonline.com/COMMON/discovery/v2.0/keys}