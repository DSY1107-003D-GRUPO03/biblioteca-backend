# Clúster de RabbitMQ de 2 nodos (rabbit1 + rabbit2).
name: biblioteca-rabbitmq

x-rabbit-env: &rabbit-env
  RABBITMQ_ERLANG_COOKIE: ${RABBIT_ERLANG_COOKIE}
  RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}

services:
  rabbit1:
    image: rabbitmq:3-management
    container_name: rabbit1
    hostname: rabbit1
    restart: unless-stopped
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit1
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola de administración
    volumes:
      - rabbit1-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - biblioteca-net

  rabbit2:
    image: rabbitmq:3-management
    container_name: rabbit2
    hostname: rabbit2
    restart: unless-stopped
    depends_on:
      rabbit1:
        condition: service_healthy
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit2
    ports:
      - "5673:5672"     # AMQP (host 5673 -> contenedor 5672)
      - "15673:15672"   # consola de administración
    volumes:
      - rabbit2-data:/var/lib/rabbitmq
      - ./rabbitmq/join-cluster.sh:/join-cluster.sh:ro
    entrypoint: ["bash", "/join-cluster.sh"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - biblioteca-net

volumes:
  rabbit1-data:
  rabbit2-data:

networks:
  biblioteca-net:
    driver: bridge
